# ==============================================================================
# /opt/trmm/docker-compose.yml
# Tactical RMM - Docker Stack (basiert auf amidaware/tacticalrmm/docker)
# ==============================================================================
# Diese Datei wird von install.sh verwaltet und bei Updates ueberschrieben.
# Eigene Anpassungen gehoeren in /opt/trmm/.env oder in eine
# docker-compose.override.yml (wird von docker compose automatisch geladen).
#
# Abweichungen zum Upstream-Compose:
#   - aktuelle Datenbank-Images (PostgreSQL 18, Redis 8, MongoDB 8.0)
#     statt der EOL-Versionen postgres:13 / redis:6.0 / mongo:4.4
#   - Volumes der Datenbanken tragen die Major-Version im Namen, damit ein
#     Versionswechsel nie still auf einem leeren/inkompatiblen Volume startet
#     (Migration: trmmctl migrate-db)
#   - Healthchecks + depends_on-Conditions statt reiner Start-Reihenfolge
#   - Redis/MongoDB laufen mit dem Privilege-Drop der offiziellen Images
#   - Log-Rotation fuer alle Container, begrenzter MongoDB-Cache
# ==============================================================================

name: trmm

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  proxy:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24
  api-db: null
  redis: null
  mesh-db: null

volumes:
  tactical_data: null
  mesh_data: null
  redis_data: null
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-trmm}_postgres${POSTGRES_VERSION:-18}_data
  mongo_data:
    name: ${COMPOSE_PROJECT_NAME:-trmm}_mongo${MONGO_VERSION:-8.0}_data

services:
  # postgres database for api service
  tactical-postgres:
    container_name: trmm-postgres
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    restart: always
    stop_grace_period: 1m
    logging: *logging
    environment:
      POSTGRES_DB: tacticalrmm
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      # Layout von postgres:18 - explizit gesetzt, damit auch aeltere Images
      # (VOLUME /var/lib/postgresql/data) nicht in ein anonymes Volume schreiben
      PGDATA: /var/lib/postgresql/${POSTGRES_VERSION:-18}/docker
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d tacticalrmm"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - api-db

  # redis container for celery tasks
  tactical-redis:
    container_name: trmm-redis
    image: redis:${REDIS_VERSION:-8}-alpine
    command: ["redis-server", "--loglevel", "warning"]
    restart: always
    logging: *logging
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - redis

  # used to initialize the docker environment
  tactical-init:
    container_name: trmm-init
    image: ${IMAGE_REPO:-tacticalrmm/}tactical:${VERSION:-latest}
    restart: on-failure
    logging: *logging
    command: ["tactical-init"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASS: ${POSTGRES_PASS}
      APP_HOST: ${APP_HOST}
      API_HOST: ${API_HOST}
      CSRF_COOKIE_DOMAIN: ${CSRF_COOKIE_DOMAIN:-}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      MESH_USER: ${MESH_USER}
      MESH_HOST: ${MESH_HOST}
      TRMM_USER: ${TRMM_USER}
      TRMM_PASS: ${TRMM_PASS}
      TRMM_DISABLE_WEB_TERMINAL: ${TRMM_DISABLE_WEB_TERMINAL:-False}
      TRMM_DISABLE_SERVER_SCRIPTS: ${TRMM_DISABLE_SERVER_SCRIPTS:-False}
      TRMM_DISABLE_SSO: ${TRMM_DISABLE_SSO:-False}
    depends_on:
      tactical-postgres:
        condition: service_healthy
      tactical-redis:
        condition: service_healthy
      tactical-meshcentral:
        condition: service_started
    networks:
      - api-db
      - proxy
      - redis
    volumes:
      - tactical_data:/opt/tactical
      - mesh_data:/meshcentral-data

  # nats
  tactical-nats:
    container_name: trmm-nats
    image: ${IMAGE_REPO:-tacticalrmm/}tactical-nats:${VERSION:-latest}
    user: 1000:1000
    restart: always
    logging: *logging
    environment:
      API_HOST: ${API_HOST}
    volumes:
      - tactical_data:/opt/tactical
    networks:
      api-db: null
      proxy:
        aliases:
          - ${API_HOST}

  # meshcentral container
  tactical-meshcentral:
    container_name: trmm-meshcentral
    image: ${IMAGE_REPO:-tacticalrmm/}tactical-meshcentral:${VERSION:-latest}
    user: 1000:1000
    restart: always
    logging: *logging
    environment:
      MESH_HOST: ${MESH_HOST}
      MESH_USER: ${MESH_USER}
      MESH_PASS: ${MESH_PASS}
      MONGODB_USER: ${MONGODB_USER}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      MESH_PERSISTENT_CONFIG: ${MESH_PERSISTENT_CONFIG:-0}
    networks:
      proxy:
        aliases:
          - ${MESH_HOST}
      mesh-db: null
    volumes:
      - tactical_data:/opt/tactical
      - mesh_data:/home/node/app/meshcentral-data
    depends_on:
      tactical-mongodb:
        condition: service_healthy

  # mongodb container for meshcentral
  # MongoDB >= 5.0 braucht AVX - unter Proxmox CPU-Typ "host" oder "x86-64-v3"
  # (install.sh bricht ohne AVX ab, trmmctl verweigert dann den Start)
  tactical-mongodb:
    container_name: trmm-mongodb
    image: mongo:${MONGO_VERSION:-8.0}
    command: ["--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB:-0.25}"]
    restart: always
    stop_grace_period: 1m
    logging: *logging
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
      MONGO_INITDB_DATABASE: meshcentral
    healthcheck:
      # mongosh ab 5.0, das alte mongo-Shell nur bei 4.4
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' 2>/dev/null || mongo --quiet --eval 'db.adminCommand(\"ping\").ok'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - mesh-db
    volumes:
      - mongo_data:/data/db

  # container that hosts vue frontend
  tactical-frontend:
    container_name: trmm-frontend
    image: ${IMAGE_REPO:-tacticalrmm/}tactical-frontend:${VERSION:-latest}
    user: 1000:1000
    restart: always
    logging: *logging
    networks:
      - proxy
    volumes:
      - tactical_data:/opt/tactical
    environment:
      API_HOST: ${API_HOST}

  # container for django backend
  tactical-backend:
    container_name: trmm-backend
    image: ${IMAGE_REPO:-tacticalrmm/}tactical:${VERSION:-latest}
    user: 1000:1000
    command: ["tactical-backend"]
    restart: always
    logging: *logging
    networks:
      - proxy
      - api-db
      - redis
    volumes:
      - tactical_data:/opt/tactical
    depends_on:
      tactical-postgres:
        condition: service_healthy

  # container for django websockets connections
  tactical-websockets:
    container_name: trmm-websockets
    image: ${IMAGE_REPO:-tacticalrmm/}tactical:${VERSION:-latest}
    user: 1000:1000
    command: ["tactical-websockets"]
    restart: always
    logging: *logging
    networks:
      - proxy
      - api-db
      - redis
    volumes:
      - tactical_data:/opt/tactical
    depends_on:
      tactical-postgres:
        condition: service_healthy
      tactical-backend:
        condition: service_started

  # container for tactical reverse proxy
  tactical-nginx:
    container_name: trmm-nginx
    image: ${IMAGE_REPO:-tacticalrmm/}tactical-nginx:${VERSION:-latest}
    user: 1000:1000
    restart: always
    logging: *logging
    environment:
      APP_HOST: ${APP_HOST}
      API_HOST: ${API_HOST}
      MESH_HOST: ${MESH_HOST}
      CERT_PUB_KEY: ${CERT_PUB_KEY:-}
      CERT_PRIV_KEY: ${CERT_PRIV_KEY:-}
    networks:
      proxy:
        ipv4_address: 172.20.0.20
    ports:
      - "${TRMM_HTTP_PORT:-80}:8080"
      - "${TRMM_HTTPS_PORT:-443}:4443"
    volumes:
      - tactical_data:/opt/tactical

  # container for celery worker service
  tactical-celery:
    container_name: trmm-celery
    image: ${IMAGE_REPO:-tacticalrmm/}tactical:${VERSION:-latest}
    user: 1000:1000
    command: ["tactical-celery"]
    restart: always
    logging: *logging
    networks:
      - redis
      - proxy
      - api-db
    volumes:
      - tactical_data:/opt/tactical
    depends_on:
      tactical-postgres:
        condition: service_healthy
      tactical-redis:
        condition: service_healthy

  # container for celery beat service
  tactical-celerybeat:
    container_name: trmm-celerybeat
    image: ${IMAGE_REPO:-tacticalrmm/}tactical:${VERSION:-latest}
    user: 1000:1000
    command: ["tactical-celerybeat"]
    restart: always
    logging: *logging
    networks:
      - proxy
      - redis
      - api-db
    volumes:
      - tactical_data:/opt/tactical
    depends_on:
      tactical-postgres:
        condition: service_healthy
      tactical-redis:
        condition: service_healthy
